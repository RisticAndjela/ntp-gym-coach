services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gymcoach
      POSTGRES_USER: gymcoach
      POSTGRES_PASSWORD: gymcoach
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymcoach -d gymcoach"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  auth:
    build:
      context: .
      args:
        SERVICE: auth
        BIN: auth
    environment:
      DATABASE_URL: postgres://gymcoach:gymcoach@postgres:5432/gymcoach
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  user:
    build:
      context: .
      args:
        SERVICE: ntp-gym-coach-user
        BIN: ntp-gym-coach-user
    environment:
      DATABASE_URL: postgres://gymcoach:gymcoach@postgres:5432/gymcoach
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"

  training:
    build:
      context: .
      args:
        SERVICE: training
        BIN: training
    environment:
      DATABASE_URL: postgres://gymcoach:gymcoach@postgres:5432/gymcoach
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"

  program:
    build:
      context: .
      args:
        SERVICE: program
        BIN: program
    environment:
      DATABASE_URL: postgres://gymcoach:gymcoach@postgres:5432/gymcoach
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"

  analytics:
    build:
      context: .
      args:
        SERVICE: analytic-recommendation
        BIN: analytic-recommendation
    ports:
      - "8085:8085"

  gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
        BIN: api-gateway
    environment:
      AUTH_SERVICE_URL: http://auth:8081
      USER_SERVICE_URL: http://user:8082
      TRAINING_SERVICE_URL: http://training:8083
      PROGRAM_SERVICE_URL: http://program:8084
      ANALYTICS_SERVICE_URL: http://analytics:8085
    depends_on:
      - auth
      - user
      - training
      - program
      - analytics
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./gym-coach-frontend
    depends_on:
      - gateway
    ports:
      - "4200:80"

volumes:
  postgres_data:
